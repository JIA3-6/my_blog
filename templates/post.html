<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>新增文章</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 120px; }
        .btn { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .back { display: inline-block; margin-top: 15px; text-decoration: none; color: #6c757d; }
    </style>
</head>
<body>
    <h1>發表新文章</h1>
    <form method="POST">
        <div class="form-group">
            <label for="title">標題 (Title):</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="author">作者 (Author):</label>
            <input type="text" id="author" name="author" required>
        </div>
        <div class="form-group">
            <label for="content">文章內容 (Content):</label>
            <textarea id="content" name="content" required></textarea>
        </div>
        <button type="submit" class="btn">送出發表</button>
    </form>
    <a href="{{ url_for('index') }}" class="back">← 回首頁</a>
</body>
</html>
