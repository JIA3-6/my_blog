<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的簡易部落格</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .post { border-bottom: 1px solid #ddd; padding-bottom: 20px; margin-bottom: 20px; }
        .btn { display: inline-block; background: #007BFF; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>我的簡易部落格</h1>
    <a href="{{ url_for('add_post') }}" class="btn">＋ 新增文章</a>
    
    <hr>

    {% if posts %}
        {% for post in posts %}
            <div class="post">
                <h2>{{ post.title }}</h2>
                <p><small>作者：{{ post.author }}</small></p>
                <p>{{ post.content }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>目前還沒有任何文章喔！</p>
    {% endif %}
</body>
</html>
